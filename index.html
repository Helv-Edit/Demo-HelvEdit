<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pour toi, Mathilde ♡</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 2rem;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .heart {
      font-size: 3rem;
      animation: pulse 1.5s infinite;
      display: inline-block;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.2); }
    }

    .name {
      margin-top: 1.5rem;
      font-size: 3.2rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      color: #fff;
    }

    .name span {
      color: #c9a84c;
    }

    .subtitle {
      margin-top: 0.6rem;
      font-size: 1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #c9a84c;
      margin: 2rem auto;
    }

    .message {
      max-width: 480px;
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.9;
      color: #ccc;
      font-style: italic;
    }

    .signature {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: #c9a84c;
    }

    /* Petits coeurs flottants */
    .hearts-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container { position: relative; z-index: 1; }

    .floating-heart {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { opacity: 0; transform: translateY(100vh) scale(0.5); }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { opacity: 0; transform: translateY(-10vh) scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="hearts-bg" id="hearts"></div>

  <div class="container">
    <div class="heart">♡</div>
    <div class="name">Mathilde<span>,</span></div>
    <div class="subtitle">la plus belle</div>
    <div class="divider"></div>
    <div class="message">
      Chaque jour à tes côtés est une chance que je ne prends jamais pour acquise.<br><br>
      Tu es ma lumière, mon calme, ma maison.<br><br>
      Je t'aime — hier, aujourd'hui, et tous les jours qui restent.
    </div>
    <div class="signature">— Avec tout mon amour ♡</div>
  </div>

  <script>
    const container = document.getElementById('hearts');
    for (let i = 0; i < 18; i++) {
      const h = document.createElement('div');
      h.className = 'floating-heart';
      h.textContent = '♡';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.animationDuration = (6 + Math.random() * 8) + 's';
      h.style.animationDelay = (Math.random() * 8) + 's';
      h.style.fontSize = (0.8 + Math.random() * 1.2) + 'rem';
      container.appendChild(h);
    }
  </script>

</body>
</html>
