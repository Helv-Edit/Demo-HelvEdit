<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Helv'Edit — Agence Webdesign Suisse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      color: #fff;
    }

    .logo span {
      color: #c9a84c;
    }

    .tagline {
      margin-top: 1rem;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #888;
    }

    .divider {
      width: 60px;
      height: 1px;
      background: #c9a84c;
      margin: 2rem auto;
    }

    .status {
      font-size: 0.85rem;
      color: #555;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Helv<span>'</span>Edit</div>
    <div class="tagline">Agence Webdesign — Suisse</div>
    <div class="divider"></div>
    <div class="status">Bientôt en ligne</div>
  </div>
</body>
</html>
