<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset — Animation Pokéball Catch</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    /* ── HEADER DEMO ── */
    header {
      position: sticky; top: 0; z-index: 50;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 0 2rem;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-weight: 800; font-size: 1.2rem; }
    .logo span { color: #A11A1C; }

    #cart-icon {
      position: relative;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #cart-icon:hover { background: #f5f5f5; }
    #cart-icon svg { width: 22px; height: 22px; }

    #cart-count {
      position: absolute;
      top: 2px; right: 2px;
      background: #A11A1C;
      color: white;
      font-size: 0.6rem; font-weight: 800;
      min-width: 16px; height: 16px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      display: none;
    }
    #cart-count.visible { display: flex; }

    /* ── PRODUIT CARDS ── */
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(3, 280px);
      gap: 1.5rem;
      padding: 3rem;
      justify-content: center;
    }

    .product-card {
      background: #E8EBF4;
      border-radius: 14px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    .card-image {
      aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      user-select: none;
    }
    .card-image.c1 { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .card-image.c2 { background: linear-gradient(135deg, #fce7f3, #fbcfe8); }
    .card-image.c3 { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }

    .card-info { padding: 0.75rem 1rem 1rem; }
    .card-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.3rem; color: #1a1a1a; }
    .card-price { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.75rem; color: #1a1a1a; }

    .btn-add {
      width: 100%;
      background: #A11A1C;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem;
      font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-add:hover { background: #8a1518; }
    .btn-add:active { transform: scale(0.97); }
    .btn-add:disabled { background: #ccc; cursor: not-allowed; }

    /* ── POKÉBALL ── */
    #pokeball {
      position: fixed;
      z-index: 9998;
      pointer-events: none;
      width: 80px;
      height: 80px;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.3));
    }

    #pb-top {
      position: absolute;
      top: 0; left: 0;
      width: 80px; height: 40px;
      background: #E53E3E;
      border-radius: 40px 40px 0 0;
      border: 4px solid #1a1a1a;
      border-bottom: none;
      transform-origin: center bottom;
    }

    #pb-bottom {
      position: absolute;
      bottom: 0; left: 0;
      width: 80px; height: 40px;
      background: white;
      border-radius: 0 0 40px 40px;
      border: 4px solid #1a1a1a;
      border-top: none;
    }

    #pb-band {
      position: absolute;
      top: 50%; left: 0;
      transform: translateY(-50%);
      width: 80px; height: 12px;
      background: #1a1a1a;
      z-index: 2;
    }

    #pb-button {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 26px; height: 26px;
      border-radius: 50%;
      background: white;
      border: 4px solid #1a1a1a;
      z-index: 3;
      transition: background 0.1s;
    }

    #pb-button-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 22px; height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
      z-index: 4;
      opacity: 0;
    }

    /* ── FLYING CLONE ── */
    .flying-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9997;
      border-radius: 12px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }

    /* ── SPARKLES ── */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    /* ── FLASH ── */
    #light-flash {
      position: fixed;
      inset: 0;
      background: white;
      pointer-events: none;
      z-index: 9995;
      opacity: 0;
    }

    /* ── CAUGHT TEXT ── */
    #caught-text {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      font-family: 'Segoe UI', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #A11A1C;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      opacity: 0;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      transform: translate(-50%, -50%);
    }

    /* ── LABEL DEMO ── */
    .demo-label {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: #888;
    }
    .demo-label strong { color: #333; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">Poke<span>Vault</span></div>
  <div id="cart-icon">
    <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
    </svg>
    <span id="cart-count">0</span>
  </div>
</header>

<!-- Demo -->
<p class="demo-label">Clique sur <strong>Ajouter au panier</strong> pour voir l'animation</p>

<div class="demo-grid">
  <!-- Card 1 -->
  <div class="product-card">
    <div class="card-image c1" data-emoji="🛡️">🛡️</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique Display</div>
      <div class="card-price">29,99 €</div>
      <button class="btn-add" onclick="catchToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>

  <!-- Card 2 -->
  <div class="product-card">
    <div class="card-image c2" data-emoji="📦">📦</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique ETB</div>
      <div class="card-price">22,99 €</div>
      <button class="btn-add" onclick="catchToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>

  <!-- Card 3 -->
  <div class="product-card">
    <div class="card-image c3" data-emoji="✨">✨</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique Bundle</div>
      <div class="card-price">19,99 €</div>
      <button class="btn-add" onclick="catchToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>
</div>

<!-- Pokéball -->
<div id="pokeball">
  <div id="pb-top"></div>
  <div id="pb-bottom"></div>
  <div id="pb-band"></div>
  <div id="pb-button"></div>
  <div id="pb-button-glow"></div>
</div>

<!-- Flash -->
<div id="light-flash"></div>

<!-- Caught text -->
<div id="caught-text">Attrapé !</div>

<script>
let isAnimating = false;
let cartCount   = 0;

const pokeball    = document.getElementById('pokeball');
const pbTop       = document.getElementById('pb-top');
const pbButton    = document.getElementById('pb-button');
const pbButtonGlow= document.getElementById('pb-button-glow');
const lightFlash  = document.getElementById('light-flash');
const caughtText  = document.getElementById('caught-text');
const cartCountEl = document.getElementById('cart-count');
const cartIcon    = document.getElementById('cart-icon');

/* ── SPARKLES ────────────────────────────────────────────────────────── */
const COLORS = ['#E53E3E','#FFCB05','#60A5FA','#34D399','#F472B6','#A78BFA'];

function createSparkles(x, y, count = 12) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.style.cssText = `
      left: ${x}px; top: ${y}px;
      background: ${COLORS[i % COLORS.length]};
      width: ${4 + Math.random() * 6}px;
      height: ${4 + Math.random() * 6}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    document.body.appendChild(el);

    const angle  = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const dist   = 60 + Math.random() * 80;
    const tx     = Math.cos(angle) * dist;
    const ty     = Math.sin(angle) * dist;

    gsap.fromTo(el,
      { x: 0, y: 0, scale: 1, opacity: 1 },
      {
        x: tx, y: ty, scale: 0, opacity: 0,
        duration: 0.7 + Math.random() * 0.4,
        ease: 'power2.out',
        onComplete: () => el.remove()
      }
    );
  }
}

/* ── MAIN ANIMATION ──────────────────────────────────────────────────── */
function catchToCart(btn) {
  if (isAnimating) return;
  isAnimating = true;

  // Disable button
  btn.disabled = true;

  const card      = btn.closest('.product-card');
  const imgEl     = card.querySelector('.card-image');
  const cartRect  = cartIcon.getBoundingClientRect();
  const imgRect   = imgEl.getBoundingClientRect();

  // Cart target position
  const cartX = cartRect.left + cartRect.width  / 2;
  const cartY = cartRect.top  + cartRect.height / 2;

  // Pokéball appears above cart
  const pbX = cartX;
  const pbY = cartY - 20;

  // 1. Create flying clone
  const clone = document.createElement('div');
  clone.className = 'flying-clone';
  clone.style.cssText = `
    left: ${imgRect.left}px;
    top:  ${imgRect.top}px;
    width: ${imgRect.width}px;
    height: ${imgRect.height}px;
    font-size: ${imgRect.height * 0.45}px;
    background: ${getComputedStyle(imgEl).background};
  `;
  clone.textContent = imgEl.textContent;
  document.body.appendChild(clone);

  // 2. Set pokeball position
  gsap.set(pokeball, {
    left: pbX,
    top:  pbY,
    scale: 0,
    opacity: 0,
    rotation: 0
  });

  const tl = gsap.timeline({
    onComplete: () => {
      isAnimating = false;
      btn.disabled = false;
    }
  });

  // ── Phase 1 : Clone fly ────────────────────────────────────────────
  tl.to(clone, {
    x: pbX - imgRect.left - imgRect.width  / 2,
    y: pbY - imgRect.top  - imgRect.height / 2 - 30,
    scale: 0.35,
    rotation: -15,
    opacity: 0.9,
    duration: 0.55,
    ease: 'power2.in'
  });

  // ── Phase 2 : Pokéball apparaît ───────────────────────────────────
  tl.to(pokeball, {
    scale: 1,
    opacity: 1,
    duration: 0.2,
    ease: 'back.out(2)'
  }, '-=0.1');

  // ── Phase 3 : Ouverture ────────────────────────────────────────────
  tl.to(pbTop, {
    y: -28,
    duration: 0.18,
    ease: 'power2.out'
  });

  // Clone entre dans la balle
  tl.to(clone, {
    x: pbX - imgRect.left - imgRect.width  / 2,
    y: pbY - imgRect.top  - imgRect.height / 2,
    scale: 0,
    opacity: 0,
    duration: 0.15,
    ease: 'power2.in',
    onComplete: () => clone.remove()
  }, '<');

  // ── Phase 4 : Flash + fermeture ───────────────────────────────────
  tl.to(lightFlash, { opacity: 0.6, duration: 0.06 });
  tl.to(lightFlash, { opacity: 0,   duration: 0.12 });

  tl.to(pbTop, {
    y: 0,
    duration: 0.25,
    ease: 'bounce.out'
  }, '-=0.08');

  // Bouton qui s'illumine
  tl.to(pbButton,     { background: '#FFCB05', duration: 0.1 }, '<');
  tl.to(pbButtonGlow, { opacity: 1,            duration: 0.1 }, '<');

  // ── Phase 5 : Shake (attrapé !) ───────────────────────────────────
  tl.to(pokeball, {
    keyframes: [
      { rotation: -18, duration: 0.14, ease: 'power2.out' },
      { rotation:  18, duration: 0.14, ease: 'power2.inOut' },
      { rotation: -12, duration: 0.12, ease: 'power2.inOut' },
      { rotation:  12, duration: 0.12, ease: 'power2.inOut' },
      { rotation:  -6, duration: 0.10, ease: 'power2.inOut' },
      { rotation:   0, duration: 0.10, ease: 'power2.out' }
    ]
  });

  // Bouton qui repasse blanc
  tl.to(pbButton,     { background: 'white', duration: 0.2 }, '<+=0.4');
  tl.to(pbButtonGlow, { opacity: 0,          duration: 0.2 }, '<');

  // ── Phase 6 : Sparkles + "Attrapé!" ──────────────────────────────
  tl.add(() => {
    createSparkles(pbX, pbY, 14);

    // Texte "Attrapé !"
    gsap.set(caughtText, { left: pbX, top: pbY - 55 });
    gsap.fromTo(caughtText,
      { opacity: 0, y: 0, scale: 0.7 },
      { opacity: 1, y: -20, scale: 1, duration: 0.3, ease: 'back.out(2)' }
    );
    gsap.to(caughtText, { opacity: 0, y: -40, duration: 0.35, delay: 0.7, ease: 'power2.in' });
  });

  // ── Phase 7 : Pokéball disparaît ──────────────────────────────────
  tl.to(pokeball, {
    scale: 0,
    opacity: 0,
    y: -20,
    duration: 0.35,
    ease: 'power2.in',
    delay: 0.5
  });

  // ── Phase 8 : Cart count ──────────────────────────────────────────
  tl.add(() => {
    cartCount++;
    cartCountEl.textContent = cartCount;
    cartCountEl.classList.add('visible');

    gsap.fromTo(cartCountEl,
      { scale: 2.5 },
      { scale: 1, duration: 0.5, ease: 'elastic.out(1.2, 0.5)' }
    );

    gsap.fromTo(cartIcon,
      { scale: 1.2 },
      { scale: 1, duration: 0.4, ease: 'back.out' }
    );
  }, '-=0.1');
}
</script>
</body>
</html>
