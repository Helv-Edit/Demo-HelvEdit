<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option B — Pokéball spawn sur la carte</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: white; border-bottom: 1px solid #e5e5e5;
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-weight: 800; font-size: 1.2rem; }
    .logo span { color: #A11A1C; }
    .label-tag {
      font-size: 0.72rem; font-weight: 700; color: #A11A1C;
      background: #fef2f2; border: 1px solid #fecaca;
      padding: 0.25rem 0.75rem; border-radius: 20px;
    }

    #cart-icon {
      position: relative; width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px; cursor: pointer; transition: background 0.15s;
    }
    #cart-icon:hover { background: #f5f5f5; }
    #cart-icon svg { width: 22px; height: 22px; }
    #cart-count {
      position: absolute; top: 2px; right: 2px;
      background: #A11A1C; color: white;
      font-size: 0.6rem; font-weight: 800;
      min-width: 16px; height: 16px; border-radius: 8px;
      display: none; align-items: center; justify-content: center; padding: 0 3px;
    }
    #cart-count.visible { display: flex; }

    .demo-grid {
      display: grid; grid-template-columns: repeat(3, 260px);
      gap: 1.5rem; padding: 3rem; justify-content: center;
    }

    .product-card {
      background: #E8EBF4; border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.2s;
    }
    .card-image {
      aspect-ratio: 4/3; display: flex; align-items: center;
      justify-content: center; font-size: 3rem; user-select: none;
      position: relative;
    }
    .c1 { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .c2 { background: linear-gradient(135deg, #fce7f3, #fbcfe8); }
    .c3 { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
    .card-info { padding: 0.75rem 1rem 1rem; }
    .card-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.3rem; }
    .card-price { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.75rem; }
    .btn-add {
      width: 100%; background: #A11A1C; color: white;
      border: none; border-radius: 8px; padding: 0.6rem;
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: background 0.2s;
    }
    .btn-add:hover { background: #8a1518; }
    .btn-add:disabled { background: #ccc; cursor: not-allowed; }

    /* ── POKÉBALL ── */
    #pokeball {
      position: fixed; z-index: 9998; pointer-events: none;
      width: 90px; height: 90px;
      opacity: 0; transform: translate(-50%, -50%) scale(0);
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.35));
    }
    #pb-top {
      position: absolute; top: 0; left: 0;
      width: 90px; height: 45px; background: #E53E3E;
      border-radius: 45px 45px 0 0;
      border: 4.5px solid #1a1a1a; border-bottom: none;
    }
    #pb-bottom {
      position: absolute; bottom: 0; left: 0;
      width: 90px; height: 45px; background: white;
      border-radius: 0 0 45px 45px;
      border: 4.5px solid #1a1a1a; border-top: none;
    }
    #pb-band {
      position: absolute; top: 50%; left: 0;
      transform: translateY(-50%);
      width: 90px; height: 13px; background: #1a1a1a; z-index: 2;
    }
    #pb-button {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 28px; height: 28px; border-radius: 50%;
      background: white; border: 4.5px solid #1a1a1a; z-index: 3;
    }

    /* Mini ball qui fly vers le cart */
    .mini-ball {
      position: fixed; z-index: 9999; pointer-events: none;
      width: 22px; height: 22px; border-radius: 50%;
      background: conic-gradient(#E53E3E 180deg, white 180deg);
      border: 2.5px solid #1a1a1a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .sparkle {
      position: fixed; pointer-events: none; z-index: 9999;
      border-radius: 50%;
    }

    #light-flash {
      position: fixed; inset: 0; background: white;
      pointer-events: none; z-index: 9995; opacity: 0;
    }

    p.demo-label {
      text-align: center; padding: 1.5rem;
      font-size: 0.85rem; color: #888;
    }
    p.demo-label strong { color: #333; }
  </style>
</head>
<body>

<header>
  <div class="logo">Poke<span>Vault</span></div>
  <span class="label-tag">Option B — Spawn sur la carte</span>
  <div id="cart-icon">
    <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
    </svg>
    <span id="cart-count">0</span>
  </div>
</header>

<p class="demo-label">La Pokéball apparaît <strong>directement sur la carte</strong>, l'avale, puis une mini-ball vole vers le panier</p>

<div class="demo-grid">
  <div class="product-card">
    <div class="card-image c1">🛡️</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique Display</div>
      <div class="card-price">29,99 €</div>
      <button class="btn-add" onclick="catchToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>
  <div class="product-card">
    <div class="card-image c2">📦</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique ETB</div>
      <div class="card-price">22,99 €</div>
      <button class="btn-add" onclick="catchToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>
  <div class="product-card">
    <div class="card-image c3">✨</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique Bundle</div>
      <div class="card-price">19,99 €</div>
      <button class="btn-add" onclick="catchToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>
</div>

<div id="pokeball">
  <div id="pb-top"></div>
  <div id="pb-bottom"></div>
  <div id="pb-band"></div>
  <div id="pb-button"></div>
</div>
<div id="light-flash"></div>

<script>
let isAnimating = false;
let cartCount   = 0;
const pokeball    = document.getElementById('pokeball');
const pbTop       = document.getElementById('pb-top');
const pbButton    = document.getElementById('pb-button');
const lightFlash  = document.getElementById('light-flash');
const cartCountEl = document.getElementById('cart-count');
const cartIcon    = document.getElementById('cart-icon');
const COLORS = ['#E53E3E','#FFCB05','#60A5FA','#34D399','#F472B6','#A78BFA'];

function createSparkles(x, y, count = 10) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    const size = 4 + Math.random() * 6;
    el.style.cssText = `left:${x}px;top:${y}px;background:${COLORS[i%COLORS.length]};width:${size}px;height:${size}px;`;
    document.body.appendChild(el);
    const angle = (i / count) * Math.PI * 2;
    const dist  = 50 + Math.random() * 60;
    gsap.to(el, {
      x: Math.cos(angle)*dist, y: Math.sin(angle)*dist,
      scale: 0, opacity: 0, duration: 0.6 + Math.random()*0.3,
      ease: 'power2.out', onComplete: () => el.remove()
    });
  }
}

function catchToCart(btn) {
  if (isAnimating) return;
  isAnimating = true;
  btn.disabled = true;

  const card     = btn.closest('.product-card');
  const imgEl    = card.querySelector('.card-image');
  const imgRect  = imgEl.getBoundingClientRect();
  const cartRect = cartIcon.getBoundingClientRect();

  // Pokéball au centre de l'image de la carte
  const pbX = imgRect.left + imgRect.width  / 2;
  const pbY = imgRect.top  + imgRect.height / 2;

  // Cible : icône panier
  const cartX = cartRect.left + cartRect.width  / 2;
  const cartY = cartRect.top  + cartRect.height / 2;

  // Pokéball spawn au centre de la carte
  gsap.set(pokeball, { left: pbX, top: pbY, scale: 0, opacity: 0, rotation: 0 });
  gsap.set(pbTop,    { y: 0 });
  gsap.set(pbButton, { background: 'white' });

  const tl = gsap.timeline({ onComplete: () => { isAnimating = false; btn.disabled = false; } });

  // 1. Pokéball apparaît sur la carte
  tl.to(pokeball, { scale: 1.1, opacity: 1, duration: 0.25, ease: 'back.out(3)' });
  tl.to(pokeball, { scale: 1, duration: 0.1 });

  // 2. Ouverture
  tl.to(pbTop, { y: -30, duration: 0.2, ease: 'power2.out' });

  // 3. L'image de la carte disparaît (absorbée)
  tl.to(imgEl, { scale: 0.8, opacity: 0, duration: 0.2, ease: 'power2.in' }, '<');

  // 4. Flash + fermeture
  tl.to(lightFlash, { opacity: 0.5, duration: 0.05 });
  tl.to(lightFlash, { opacity: 0,   duration: 0.1  });
  tl.to(pbTop,   { y: 0,        duration: 0.2, ease: 'bounce.out' }, '-=0.05');
  tl.to(pbButton,{ background: '#FFCB05', duration: 0.1 }, '<');

  // 5. Shake
  tl.to(pokeball, {
    keyframes: [
      { rotation: -15, duration: 0.13 },
      { rotation:  15, duration: 0.13 },
      { rotation: -10, duration: 0.11 },
      { rotation:  10, duration: 0.11 },
      { rotation:   0, duration: 0.09 }
    ]
  });

  // 6. Sparkles sur la carte
  tl.add(() => createSparkles(pbX, pbY, 10));

  // 7. Pokéball devient mini et vole vers le panier
  tl.to(pbButton, { background: 'white', duration: 0.15 });
  tl.to(pokeball, {
    left: cartX, top: cartY,
    scale: 0.22,
    duration: 0.55,
    ease: 'power3.in',
    delay: 0.1
  });

  // 8. Disparaît au cart + count
  tl.to(pokeball, { opacity: 0, scale: 0, duration: 0.15, ease: 'power2.in' });
  tl.add(() => {
    // Remet l'image de la carte
    gsap.to(imgEl, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out' });
    // Cart count
    cartCount++;
    cartCountEl.textContent = cartCount;
    cartCountEl.classList.add('visible');
    gsap.fromTo(cartCountEl, { scale: 2.2 }, { scale: 1, duration: 0.4, ease: 'elastic.out(1.2,0.5)' });
    gsap.fromTo(cartIcon, { scale: 1.25 }, { scale: 1, duration: 0.35, ease: 'back.out' });
  });
}
</script>
</body>
</html>
