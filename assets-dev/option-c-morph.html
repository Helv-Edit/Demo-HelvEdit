<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Option C — Morph carte → Pokéball</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: white; border-bottom: 1px solid #e5e5e5;
      padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-weight: 800; font-size: 1.2rem; }
    .logo span { color: #A11A1C; }
    .label-tag {
      font-size: 0.72rem; font-weight: 700; color: #7c3aed;
      background: #f5f3ff; border: 1px solid #c4b5fd;
      padding: 0.25rem 0.75rem; border-radius: 20px;
    }

    #cart-icon {
      position: relative; width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px; cursor: pointer; transition: background 0.15s;
    }
    #cart-icon:hover { background: #f5f5f5; }
    #cart-icon svg { width: 22px; height: 22px; }
    #cart-count {
      position: absolute; top: 2px; right: 2px;
      background: #A11A1C; color: white;
      font-size: 0.6rem; font-weight: 800;
      min-width: 16px; height: 16px; border-radius: 8px;
      display: none; align-items: center; justify-content: center; padding: 0 3px;
    }
    #cart-count.visible { display: flex; }

    .demo-grid {
      display: grid; grid-template-columns: repeat(3, 260px);
      gap: 1.5rem; padding: 3rem; justify-content: center;
    }

    .product-card {
      background: #E8EBF4; border-radius: 14px;
      overflow: visible; display: flex; flex-direction: column;
    }
    .card-image {
      aspect-ratio: 4/3; display: flex; align-items: center;
      justify-content: center; font-size: 3rem; user-select: none;
      border-radius: 10px 10px 0 0; overflow: hidden; position: relative;
    }
    .c1 { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
    .c2 { background: linear-gradient(135deg, #fce7f3, #fbcfe8); }
    .c3 { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
    .card-info { padding: 0.75rem 1rem 1rem; }
    .card-title { font-size: 0.85rem; font-weight: 500; margin-bottom: 0.3rem; }
    .card-price { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.75rem; }
    .btn-add {
      width: 100%; background: #A11A1C; color: white;
      border: none; border-radius: 8px; padding: 0.6rem;
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: background 0.2s;
    }
    .btn-add:hover { background: #8a1518; }
    .btn-add:disabled { background: #ccc; cursor: not-allowed; }

    /* ── MORPH CLONE ── */
    .morph-clone {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transform-origin: center;
    }

    /* Partie haute rouge de la Pokéball (overlay) */
    .morph-top {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 50%;
      background: #E53E3E;
      opacity: 0;
    }

    /* Partie basse blanche */
    .morph-bottom {
      position: absolute; bottom: 0; left: 0;
      width: 100%; height: 50%;
      background: white;
      opacity: 0;
    }

    /* Bande centrale */
    .morph-band {
      position: absolute; top: 50%; left: 0;
      transform: translateY(-50%);
      width: 100%; height: 13%;
      background: #1a1a1a;
      opacity: 0; z-index: 2;
    }

    /* Bouton central */
    .morph-btn {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 28%; aspect-ratio: 1;
      border-radius: 50%;
      background: white;
      border: 3px solid #1a1a1a;
      opacity: 0; z-index: 3;
    }

    /* Contenu original (emoji) */
    .morph-content {
      position: relative; z-index: 1;
      font-size: 3rem;
      transition: none;
    }

    /* Sparkles */
    .sparkle {
      position: fixed; pointer-events: none; z-index: 9999;
      border-radius: 50%;
    }

    /* Sillage de lumière (trail) */
    .trail {
      position: fixed; pointer-events: none; z-index: 9996;
      width: 10px; height: 10px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,203,5,0.8), transparent);
      opacity: 0;
    }

    p.demo-label {
      text-align: center; padding: 1.5rem;
      font-size: 0.85rem; color: #888;
    }
    p.demo-label strong { color: #333; }
  </style>
</head>
<body>

<header>
  <div class="logo">Poke<span>Vault</span></div>
  <span class="label-tag">Option C — Morph carte → Pokéball</span>
  <div id="cart-icon">
    <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
      <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
    </svg>
    <span id="cart-count">0</span>
  </div>
</header>

<p class="demo-label">La carte <strong>se transforme progressivement en Pokéball</strong> puis vole vers le panier</p>

<div class="demo-grid">
  <div class="product-card">
    <div class="card-image c1">🛡️</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique Display</div>
      <div class="card-price">29,99 €</div>
      <button class="btn-add" onclick="morphToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>
  <div class="product-card">
    <div class="card-image c2">📦</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique ETB</div>
      <div class="card-price">22,99 €</div>
      <button class="btn-add" onclick="morphToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>
  <div class="product-card">
    <div class="card-image c3">✨</div>
    <div class="card-info">
      <div class="card-title">Protection Acrylique Bundle</div>
      <div class="card-price">19,99 €</div>
      <button class="btn-add" onclick="morphToCart(this)">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ajouter au panier
      </button>
    </div>
  </div>
</div>

<script>
let isAnimating = false;
let cartCount   = 0;
const cartCountEl = document.getElementById('cart-count');
const cartIcon    = document.getElementById('cart-icon');
const COLORS = ['#E53E3E','#FFCB05','#60A5FA','#34D399','#F472B6'];

function createSparkles(x, y, count = 10) {
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'sparkle';
    const size = 4 + Math.random() * 7;
    el.style.cssText = `left:${x}px;top:${y}px;background:${COLORS[i%COLORS.length]};width:${size}px;height:${size}px;`;
    document.body.appendChild(el);
    const angle = (i/count)*Math.PI*2 + Math.random()*0.3;
    const dist  = 40 + Math.random() * 50;
    gsap.to(el, {
      x: Math.cos(angle)*dist, y: Math.sin(angle)*dist,
      scale: 0, opacity: 0,
      duration: 0.5 + Math.random()*0.3,
      ease: 'power2.out',
      onComplete: () => el.remove()
    });
  }
}

function morphToCart(btn) {
  if (isAnimating) return;
  isAnimating = true;
  btn.disabled = true;

  const card    = btn.closest('.product-card');
  const imgEl   = card.querySelector('.card-image');
  const imgRect = imgEl.getBoundingClientRect();
  const cartRect= cartIcon.getBoundingClientRect();
  const cartX   = cartRect.left + cartRect.width  / 2;
  const cartY   = cartRect.top  + cartRect.height / 2;

  // Taille du clone = taille de l'image de la carte
  const W = imgRect.width;
  const H = imgRect.height;

  // Créer le clone avec la même apparence que la card-image
  const clone = document.createElement('div');
  clone.className = 'morph-clone';
  clone.style.cssText = `
    left: ${imgRect.left}px;
    top:  ${imgRect.top}px;
    width: ${W}px;
    height: ${H}px;
    background: ${getComputedStyle(imgEl).background};
    border-radius: 10px;
  `;

  // Contenu (emoji)
  const content = document.createElement('div');
  content.className = 'morph-content';
  content.textContent = imgEl.textContent;

  // Overlays Pokéball
  const top    = document.createElement('div'); top.className    = 'morph-top';
  const bottom = document.createElement('div'); bottom.className = 'morph-bottom';
  const band   = document.createElement('div'); band.className   = 'morph-band';
  const button = document.createElement('div'); button.className = 'morph-btn';

  clone.append(top, bottom, band, button, content);
  document.body.appendChild(clone);

  // Cacher l'image originale
  gsap.to(imgEl, { opacity: 0, duration: 0.1 });

  const tl = gsap.timeline({
    onComplete: () => {
      isAnimating = false;
      btn.disabled = false;
      gsap.to(imgEl, { opacity: 1, duration: 0.3 });
    }
  });

  // ── Phase 1 : légère animation d'attention ─────────────────────────
  tl.to(clone, { scale: 1.05, duration: 0.15, ease: 'power1.out' });
  tl.to(clone, { scale: 1,    duration: 0.1  });

  // ── Phase 2 : Morph en cercle + Pokéball apparaît ──────────────────
  // border-radius → 50% (devient rond)
  tl.to(clone, {
    borderRadius: '50%',
    width: Math.min(W, H),
    height: Math.min(W, H),
    x: (W - Math.min(W,H)) / 2,
    y: (H - Math.min(W,H)) / 2,
    duration: 0.35,
    ease: 'power2.inOut'
  });

  // Emoji fade out, Pokéball pattern fade in
  tl.to(content, { opacity: 0, scale: 0.5, duration: 0.25, ease: 'power2.in' }, '<');
  tl.to([top, bottom], { opacity: 1, duration: 0.3, ease: 'power2.out' }, '<+=0.1');
  tl.to([band, button], { opacity: 1, duration: 0.2 }, '<+=0.15');

  // ── Phase 3 : Rotation douce (style Pokéball) ──────────────────────
  tl.to(clone, { rotation: 360, duration: 0.5, ease: 'power1.inOut' });

  // ── Phase 4 : Vole vers le panier avec trail ──────────────────────
  // Calculer centre actuel du clone
  const cloneSize = Math.min(W, H);
  const startX = imgRect.left + (W - cloneSize) / 2 + cloneSize / 2;
  const startY = imgRect.top  + (H - cloneSize) / 2 + cloneSize / 2;

  // Sparkles au départ
  tl.add(() => createSparkles(startX, startY, 8));

  // Vol parabolique vers le panier
  tl.to(clone, {
    left: cartX - cloneSize / 2,
    top:  cartY - cloneSize / 2,
    x: 0, y: 0,
    scale: 0.28,
    rotation: '+=540',
    duration: 0.65,
    ease: 'power3.in',
    motionPath: {
      path: [
        { x: 0, y: 0 },
        { x: (cartX - startX) * 0.3, y: -80 },
        { x: cartX - startX, y: cartY - startY }
      ],
      curviness: 1.5,
      type: 'cubic'
    }
  });

  // ── Phase 5 : Impact au panier ─────────────────────────────────────
  tl.add(() => {
    createSparkles(cartX, cartY, 8);
  });

  tl.to(clone, {
    scale: 0,
    opacity: 0,
    duration: 0.2,
    ease: 'power2.in',
    onComplete: () => clone.remove()
  });

  // Cart bounce + count
  tl.add(() => {
    cartCount++;
    cartCountEl.textContent = cartCount;
    cartCountEl.classList.add('visible');
    gsap.fromTo(cartCountEl, { scale: 2.2 }, { scale: 1, duration: 0.45, ease: 'elastic.out(1.2,0.5)' });
    gsap.fromTo(cartIcon, { scale: 1.3 }, { scale: 1, duration: 0.4, ease: 'back.out(2)' });
  }, '-=0.1');
}
</script>
</body>
</html>
