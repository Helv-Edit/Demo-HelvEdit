<!--
  COMPOSANT : Hero Section
  Usage : Copier dans un projet, adapter textes et couleurs via les variables CSS
  Dépendances : design-system.css, GSAP (optionnel pour animations)
-->
<section class="hero-section">
  <div class="hero-bg"></div>
  <div class="container hero-content">
    <div class="hero-badge">
      <span class="badge badge-accent">✦ Nouveau</span>
    </div>
    <h1 class="hero-title">
      Titre Principal<br>
      <span class="text-accent">Accentué</span>
    </h1>
    <p class="hero-subtitle">
      Description courte et percutante. Maximum 2 lignes. Orientée bénéfice client,
      pas features.
    </p>
    <div class="hero-actions">
      <button class="btn btn-primary btn-lg">Appel à l'action principal</button>
      <button class="btn btn-ghost btn-lg">Action secondaire →</button>
    </div>
    <div class="hero-stats">
      <div class="stat">
        <span class="stat-value">500+</span>
        <span class="stat-label">Clients satisfaits</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value">98%</span>
        <span class="stat-label">Taux de satisfaction</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-value">5★</span>
        <span class="stat-label">Note moyenne</span>
      </div>
    </div>
  </div>
</section>

<style>
.hero-section {
  position: relative; overflow: hidden;
  padding: var(--space-24) 0;
  border-bottom: 1px solid var(--border);
}
.hero-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255,203,5,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.hero-content {
  position: relative; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: var(--space-6);
}
.hero-badge { margin-bottom: var(--space-2); }
.hero-title {
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;
}
.hero-subtitle {
  font-size: clamp(1rem, 2vw, 1.25rem);
  color: var(--muted); max-width: 520px; line-height: 1.7;
}
.hero-actions { display: flex; gap: var(--space-4); flex-wrap: wrap; justify-content: center; }
.hero-stats {
  display: flex; align-items: center; gap: var(--space-8);
  margin-top: var(--space-6); padding-top: var(--space-6);
  border-top: 1px solid var(--border);
}
.stat { text-align: center; }
.stat-value { display: block; font-size: var(--text-2xl); font-weight: 800; color: var(--accent); }
.stat-label { font-size: var(--text-xs); color: var(--muted); margin-top: 2px; }
.stat-divider { width: 1px; height: 32px; background: var(--border); }

@media (max-width: 640px) {
  .hero-stats { flex-direction: column; gap: var(--space-4); }
  .stat-divider { width: 40px; height: 1px; }
  .hero-actions { flex-direction: column; width: 100%; }
  .hero-actions .btn { width: 100%; }
}
</style>
