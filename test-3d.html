<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
body{margin:0;background:#0c0d11;display:flex;align-items:center;justify-content:center;height:100vh;font-family:monospace;}
canvas{display:block;border-radius:12px;}
#s{position:fixed;top:16px;left:16px;font-size:13px;color:#34e2c4;background:rgba(0,0,0,.7);padding:8px 14px;border-radius:8px;border:1px solid rgba(52,226,196,.3);}
</style></head>
<body>
<canvas id="c" width="700" height="500"></canvas>
<div id="s">Init...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.18.1/meshopt_decoder.js"></script>
<script>
const S = t => document.getElementById('s').textContent = t;
window.addEventListener('load', async () => {
  if (!window.THREE) { S('THREE manquant'); return; }
  if (window.MeshoptDecoder) await MeshoptDecoder.ready;
  const canvas = document.getElementById('c');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 700/500, 0.1, 100);
  camera.position.set(0, 0, 5.5);
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setSize(700, 500);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dl = new THREE.DirectionalLight(0xffffff, 3); dl.position.set(4,8,6); scene.add(dl);
  const rim = new THREE.PointLight(0x34e2c4, 5, 20); scene.add(rim);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.autoRotate = true; controls.enableZoom = false;
  const cube = new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5), new THREE.MeshStandardMaterial({color:0x34e2c4,roughness:.3,metalness:.7}));
  scene.add(cube);
  S('Cube visible - chargement GLB...');
  const loader = new THREE.GLTFLoader();
  if (window.MeshoptDecoder) loader.setMeshoptDecoder(MeshoptDecoder);
  loader.load('./eevee-crown.glb',
    gltf => {
      scene.remove(cube);
      const m = gltf.scene;
      const box = new THREE.Box3().setFromObject(m);
      m.position.sub(box.getCenter(new THREE.Vector3()));
      m.scale.setScalar(2.8 / box.getSize(new THREE.Vector3()).length());
      scene.add(m); S('GLB charge OK');
    },
    xhr => { if(xhr.total) S('GLB ' + Math.round(xhr.loaded/xhr.total*100) + '%'); },
    err => S('ERREUR: ' + err.message)
  );
  const clk = new THREE.Clock();
  (function loop(){ requestAnimationFrame(loop); const t=clk.getElapsedTime(); rim.position.set(Math.sin(t*.5)*4,1,Math.cos(t*.5)*4); controls.update(); renderer.render(scene,camera); })();
});
</script></body></html>
